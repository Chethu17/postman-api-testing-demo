name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Postman API Tests
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >
            collection run
            postman/Demo_API_Test.postman_collection.json
            --environment
            postman/QA_Envi_Demo.postman_environment.json